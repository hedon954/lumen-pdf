name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build and Release DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-pdf-core

      - name: Install xcodegen
        run: brew install xcodegen

      # ── 使用 make dmg 打包 ───────────────────────────────────────────────────
      - name: Build DMG
        run: VERSION=${GITHUB_REF_NAME#v} make dmg

      # ── 从手写 CHANGELOG 读取 Release Notes ─────────────────────────────────
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog_path = "CHANGELOG.md"
          text = open(changelog_path, encoding="utf-8").read()

          heading = re.compile(rf"^## \[{re.escape(version)}\].*$", re.MULTILINE)
          match = heading.search(text)
          if not match:
              print(f"CHANGELOG.md does not contain a section for {version}", file=sys.stderr)
              sys.exit(1)

          rest = text[match.start():]
          next_section = re.search(r"\n---\s*\n## \[", rest)
          section = rest[: next_section.start()].strip() if next_section else rest.strip()
          if not section:
              print(f"CHANGELOG.md section for {version} is empty", file=sys.stderr)
              sys.exit(1)

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as output:
              output.write(section + "\n")
          PY

      # ── 发布 GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LumenPDF ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/LumenPDF-*.dmg
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
